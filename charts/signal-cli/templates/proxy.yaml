{{- if .Values.proxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "signal-cli.fullname" . }}-proxy
  labels:
    {{- include "signal-cli.labels" . | nindent 4 }}
data:
  auth-proxy.py: |-
{{ .Files.Get "files/auth-proxy.py" | indent 4 }}
---
# signal-cli-rest-api has no auth and listens on every interface: only the proxy's port may be reached
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "signal-cli.fullname" . }}-proxy-only
  labels:
    {{- include "signal-cli.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "signal-cli.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.proxy.port }}
          protocol: TCP
{{- end }}
