apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signal-cli.fullname" . }}
  labels:
    {{- include "signal-cli.labels" . | nindent 4 }}
spec:
  strategy:
    type: Recreate
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "signal-cli.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.proxy.enabled }}
        checksum/proxy: {{ .Files.Get "files/auth-proxy.py" | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "signal-cli.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "signal-cli.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: TZ
            value: Etc/UTC
          - name: MODE
            value: {{ .Values.mode | default "normal" }}
          {{- if and .Values.autoReceiveSchedule (ne (.Values.mode | default "normal") "json-rpc") }}
          - name: AUTO_RECEIVE_SCHEDULE
            value: {{ .Values.autoReceiveSchedule }}
          {{- end }}
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          ports:
            - name: {{ if .Values.proxy.enabled }}api{{ else }}http{{ end }}
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /home/.local/share/signal-cli
              name: config
            {{- if .Values.persistence.config.subPath }}
              subPath: {{ .Values.persistence.config.subPath }}
            {{- end }}
            {{- range .Values.persistence.extraExistingClaimMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ .readOnly }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
        {{- if .Values.proxy.enabled }}
        - name: proxy
          image: {{ .Values.proxy.image }}
          command: ["python3", "-I", "/proxy/auth-proxy.py"]
          env:
            - name: PORT
              value: {{ .Values.proxy.port | quote }}
            - name: UPSTREAM_PORT
              value: {{ .Values.service.port | quote }}
            - name: TOKENS_FILE
              value: /etc/signal-cli-proxy/tokens.json
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.proxy.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: proxy-script
              mountPath: /proxy
              readOnly: true
            - name: proxy-tokens
              mountPath: /etc/signal-cli-proxy
              readOnly: true
        {{- end }}
      volumes:
        {{- if .Values.proxy.enabled }}
        - name: proxy-script
          configMap:
            name: {{ include "signal-cli.fullname" . }}-proxy
        - name: proxy-tokens
          secret:
            {{- if not (or .Values.proxy.tokens .Values.proxy.tokensSecret) }}
            {{- fail "proxy.enabled needs proxy.tokens or proxy.tokensSecret" }}
            {{- end }}
            secretName: {{ .Values.proxy.tokensSecret | default (printf "%s-proxy-tokens" (include "signal-cli.fullname" .)) }}
        {{- end }}
        - name: config
        {{- if .Values.persistence.config.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.config.existingClaim }}{{ .Values.persistence.config.existingClaim }}{{- else }}{{ template "signal-cli.fullname" . }}-config{{- end }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- range .Values.persistence.extraExistingClaimMounts }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .existingClaim }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 6 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
