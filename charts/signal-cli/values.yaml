# Default values for signal-cli.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: bbernhard/signal-cli-rest-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

persistence:
  config:
    enabled: false
    ## signal-cli configuration data Persistent Volume Storage Class
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is
    ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
    ##   GKE, AWS & OpenStack)
    ##
    # storageClass: "-"
    ##
    ## If you want to reuse an existing claim, you can pass the name of the PVC using
    ## the existingClaim variable
    # existingClaim: your-claim
    # subPath: some-subpath
    accessMode: ReadWriteOnce
    size: 1Gi

# Additional volumes on the output Deployment definition.
extraVolumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
extraVolumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /v1/health
    port: 8080
readinessProbe:
  httpGet:
    path: /v1/health
    port: 8080

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# normal: one signal-cli run per request; json-rpc: resident daemon, incoming messages via websocket /v1/receive/{number} (autoReceiveSchedule is ignored in json-rpc: the image refuses it)
mode: normal

autoReceiveSchedule: 0 19 * * *

# Token proxy (files/auth-proxy.py) in front of the API, which has no auth. When enabled, the Service/Ingress go to
# the proxy and a NetworkPolicy leaves only the proxy's port reachable from outside the pod.
# tokens: {"<sha256 hex of token>": rule}; rule = {name, number, recipients: [...], allow: [...]} or
# {name, admin: true} (everything). allow (default [send, react, receive]), all for <number> only:
#   send: messages (and edits) to recipients; react: reactions to recipients; receive: websocket, ALL incoming
#   messages; delete: delete-for-everyone in chats with recipients (not in the default);
#   read: GET contacts/groups; groups: join/quit the groups listed in recipients.
# Groups are recipients too: "group.<id>" as GET /v1/groups lists it. Clients send "Authorization: Bearer <token>".
# Put them in secret values (the chart renders them into a Secret), or point tokensSecret at an existing Secret
# with key tokens.json (same JSON).
proxy:
  enabled: false
  image: python:3.13-alpine
  port: 8081
  tokens: {}
  # tokens:
  #   "<sha256 hex>": {name: claude, number: "+48...", recipients: ["+48..."]}
  #   "<sha256 hex>": {name: app, number: "+48...", recipients: ["group.abc="], allow: [send]}
  tokensSecret: ""
  resources: {}
